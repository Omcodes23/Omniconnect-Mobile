org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Fix "this and base files have different roots" — cross-drive incremental cache bug
kotlin.incremental=false

# Keep the abiFilters declared in app/build.gradle.kts (arm64-v8a + x86_64).
# Without this, the Flutter Gradle plugin overwrites them with all supported
# ABIs, which makes Gradle try to build llama.cpp for 32-bit ARM (armeabi-v7a).
# The pinned llama.cpp uses AArch64-only FP16 NEON intrinsics (vld1q_f16), so
# that ABI cannot compile.
disable-abi-filtering=true
kotlin.compiler.execution.strategy=in-process
